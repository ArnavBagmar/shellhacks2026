# The phone app. Generate the Xcode project with:
#   cd ios/CaneApp && xcodegen
# then open CaneApp.xcodeproj. All logic lives in ../CaneKit; this target is
# the composition root and the chest display.
name: CaneApp
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  CaneKit:
    path: ../CaneKit
targets:
  CaneApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: CaneKit
        products:
          - CaneContracts
          - CaneTransport
          - CaneFeedback
          - CaneNavigation
          - CaneOutput
          - CaneVoice
          - CaneCamera
          - CaneAssist
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Cane
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIStatusBarHidden: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - audio
        NSCameraUsageDescription: Cane looks ahead through the front camera when you ask what is around you or in front of you.
        NSMicrophoneUsageDescription: Cane listens for "Hey Cane" so you can ask questions hands-free.
        NSSpeechRecognitionUsageDescription: Cane turns what you say into commands on this phone.
        NSLocationWhenInUseUsageDescription: Cane uses your location for walking directions.
        NSLocalNetworkUsageDescription: Cane talks to the laptop in your backpack for 360-degree awareness.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        GoogleMapsAPIKey: $(GOOGLE_MAPS_API_KEY)
        # The black-box log (Documents/diagnostics) shows up in the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CANE_BUNDLE_ID)
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
