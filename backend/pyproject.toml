[project]
name = "cane"
version = "0.1.0"
description = "Smart cane backend: AwarenessEvent contract and X4 bridge/cloud services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "websockets>=13",
]

[project.optional-dependencies]
depth = ["torch", "torchvision", "numpy", "opencv-python>=4.11,<5"]
vision = [
    "clip",
    "ultralytics>=8.4.163,<8.5",
    "opencv-python>=4.11,<5",
    "pip>=24",
]

[tool.uv.sources]
clip = { git = "https://github.com/ultralytics/CLIP.git", rev = "a13192f8cb767260d7dfd98c843b0716593169e7" }

[project.scripts]
cane-link = "cane.transport.__main__:main"
cane-bench-yolo = "cane.benchmarks.yolo:main"
cane-bench-depth = "cane.benchmarks.depth:main"
cane-preview = "cane.benchmarks.fused:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cane"]

[tool.pytest.ini_options]
# uv's editable-install .pth can end up with the macOS UF_HIDDEN flag set
# (a local filesystem quirk), which CPython's site.py silently skips. Point
# pytest at src/ directly so collection does not depend on that mechanism.
pythonpath = ["src"]
# Both fixed explicitly so pytest-asyncio never emits a deprecation warning
# about an implicit default (asyncio tests live under tests/transport/).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
