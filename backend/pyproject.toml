[project]
name = "cane"
version = "0.1.0"
description = "Smart cane backend: AwarenessEvent contract and X4 bridge/cloud services."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "websockets>=13",
    # Step 6 — X4 bridge (grab, dewarp, one-in-flight sender)
    "numpy>=1.26",
    "opencv-python>=4.10",
    "httpx>=0.27",
    # Step 7 — cloud inference service (FastAPI + ByteTrack via supervision)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "supervision>=0.25,<0.31",  # pinned per step-07-design A7/H9; do not re-lock
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
# macOS-only native capture: OpenCV cannot select the X4's 2880x1440 mode on
# macOS, so the bridge talks to AVFoundation through PyObjC (docs/insta360feed.md).
mac = [
    "pyobjc-framework-AVFoundation; sys_platform == 'darwin'",
    "pyobjc-framework-CoreMedia; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "pyobjc-framework-libdispatch; sys_platform == 'darwin'",
]
# Real YOLO11s inference on the dev laptop (PyTorch CPU/MPS). Not needed for tests.
yolo = ["ultralytics>=8.3"]
# Cloud L4 only (linux): the TensorRT engine is exported on the serving GPU
# (step-07-design A11). Not used by docker/Dockerfile — the NGC image supplies
# torch and TensorRT; the PyPI tensorrt sdist must never be built on a Mac (A4).
gpu = ["ultralytics>=8.3; sys_platform == 'linux'", "tensorrt; sys_platform == 'linux'"]
# Step 20 -- "Hey Cane, is there a bathroom around?": the laptop asks Gemini
# about the dewarped 360 crops. Key from GEMINI_API_KEY, never in the repo.
scene = ["google-genai>=1.0"]

[project.scripts]
cane-link = "cane.transport.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cane"]

[tool.pytest.ini_options]
# uv's editable-install .pth can end up with the macOS UF_HIDDEN flag set
# (a local filesystem quirk), which CPython's site.py silently skips. Point
# pytest at src/ directly so collection does not depend on that mechanism.
pythonpath = ["src"]
# Both fixed explicitly so pytest-asyncio never emits a deprecation warning
# about an implicit default (asyncio tests live under tests/transport/).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
